[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipwright"
dynamic = ["version"]
description = "Shipwright — packaged installer console over the existing emit/install/configure/zipapp spine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shipwright" }]
# No third-party runtime deps — stdlib-first (R3 / R31).

[project.scripts]
shipwright = "sw.console:main"

[tool.setuptools.packages.find]
include = ["sw*"]
exclude = ["scripts*", "core*", "dist*", "platforms*"]

[tool.setuptools.package-data]
sw = ["scripts/**/*", "dist/**/*", "version.txt"]

[tool.setuptools.dynamic]
version = {attr = "sw.__version__"}
