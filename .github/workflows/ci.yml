name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  fixtures:
    name: fixtures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: claude-golden-fixtures
        run: python3 scripts/test/run_pytest.py scripts/unit_tests/meta/test_claude_golden.py -q

      - name: core-scripts-parity-fixtures
        run: python3 scripts/test/run_pytest.py scripts/unit_tests/meta/test_core_scripts_parity.py -q

      - name: emitter-fixtures
        run: python3 scripts/test/run_pytest.py scripts/unit_tests/meta/test_emitter.py -q

      - name: gate-fixtures
        run: python3 scripts/test/run_pytest.py scripts/unit_tests/meta/test_gate.py -q

      - name: parity-fixtures
        run: python3 scripts/test/run_pytest.py scripts/unit_tests/meta/test_parity.py -q

  verify-main-full:
    name: verify-main-full
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Named plan main-full
        run: PYTHONPATH=scripts python3 scripts/test/_runner.py verify --scope full

  verify-scheduled-full-plus-integration:
    name: verify-scheduled-full-plus-integration
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Named plan scheduled-full-plus-integration
        id: scheduled-full-plus-integration
        run: PYTHONPATH=scripts python3 scripts/test/_runner.py run-pytest --scope full scripts/unit_tests
      - name: Notify triage owner on nightly failure
        if: failure()
        env:
          SW_PLANNING_ISSUES_TOKEN: ${{ secrets.SW_PLANNING_ISSUES_TOKEN }}
        run: |
          PYTHONPATH=scripts python3 scripts/nightly-failure-notify.py \
            --job verify-scheduled-full-plus-integration \
            --workflow-run-id "${{ github.run_id }}" \
            --repository "${{ github.repository }}"

  minimum-python:
    name: minimum-python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Vendored pytest bootstrap
        run: python3 --version
      - name: minimum-python bash-py-invocation-guard
        run: python3 scripts/test/bash-py-invocation-guard.test

      - name: minimum-python capability-docs-regen-check
        run: python3 scripts/capability_docs.py regen-check

      - name: minimum-python claims-audit-unit
        run: python3 scripts/test/claims-audit-unit.test

      - name: minimum-python docs-link-check
        run: python3 scripts/docs-link-check.py

      - name: minimum-python git-push-secret-scan-chokepoint
        run: python3 scripts/test/git-push-secret-scan-chokepoint.test

      - name: minimum-python rca-fanout-unit
        run: python3 scripts/test/rca-fanout-unit.test

      - name: minimum-python scripts-inventory-guard
        run: python3 scripts/check_scripts_inventory.py

      - name: minimum-python skills-spec-guard-fixtures
        run: python3 scripts/test/skills-spec-guard.test

