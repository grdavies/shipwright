name: Release dist regen

on:
  pull_request:

permissions:
  contents: read

jobs:
  regen-dist:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate dist/
        run: python3 -m sw generate --all

      - name: Regenerate effective-config projections
        run: python3 scripts/effective_config_gen.py all --write

      - name: Assert breaking release targets major X.0.0
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          CURRENT_SECTION="$(awk '/^## \[/ { if (++n > 1) exit } { print }' CHANGELOG.md)"
          if echo "$CURRENT_SECTION" | grep -qiE '^### .*BREAKING CHANGES'; then
            if ! echo "$VERSION" | grep -qE '^[1-9][0-9]*\.0\.0$'; then
              echo "Breaking release must compute a major X.0.0, got ${VERSION}"
              exit 1
            fi
          fi

      - name: Commit refreshed dist/ and projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git add docs/guides/configuration.md
          git add core/sw-reference/generated/effective-config.json
          git add core/sw-reference/generated/upgrade-manifest-*.json
          if git diff --cached --quiet; then
            echo "dist/ and projections already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate dist/ and effective-config projections for release"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
